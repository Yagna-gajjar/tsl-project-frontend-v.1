server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff font/woff2;

    # Vite fingerprints these filenames, so a changed file is always a changed
    # URL and the cache can never go stale.
    location /assets/ {
        try_files $uri =404;
        # Deliberately not using `expires 1y`: it emits its own Cache-Control,
        # so pairing it with add_header sends two competing values. One header.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must not be cached: it is the only file that maps the app to
    # the current asset hashes, and a stale copy points at deleted bundles.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback — the nginx equivalent of the rewrite in vercel.json. Without
    # it, react-router deep links (or a refresh on /members/123) return 404
    # because no such file exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
